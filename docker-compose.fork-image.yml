# Optional overlay for the personal fork's GitHub Actions image.
# Combine with docker-compose.alt.yml and optionally docker-compose.archive.yml.
# The original /app/data mount, ports, secrets, and settings are left untouched.
services:
  gitea-mirror:
    image: ${FORK_IMAGE:-ghcr.io/mugenrei/gitea-mirror:edge}
    healthcheck:
      test:
        - CMD-SHELL
        - 'BASE="${BASE_URL:-/}"; if [ "$$BASE" = "/" ]; then BASE=""; else BASE="$${BASE%/}"; fi; wget -q -T 5 -O /dev/null "http://127.0.0.1:4321$$BASE/api/health/live"'
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 20s
